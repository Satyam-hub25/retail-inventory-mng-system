version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail-backend
    ports:
      - "8080:8080"
    environment:
      # These use environment variables passed into docker-compose
      - DB_URL=${DB_URL:-jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres}
      - DB_USERNAME=${DB_USERNAME:-postgres.pylgfxacjnekbnlyyvyj}
      - DB_PASSWORD=${DB_PASSWORD}
      - SERVER_PORT=8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
