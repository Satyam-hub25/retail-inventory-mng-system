<div class="topbar">
  <div class="topbar-left">
    <button class="toggle-sidebar-btn" (click)="onToggleSidebar()" [title]="isSidebarHidden ? 'Show Sidebar' : 'Hide Sidebar'">
      <i class="fas" [ngClass]="isSidebarHidden ? 'fa-bars' : 'fa-indent'"></i>
    </button>
  </div>

  <div class="topbar-right">
    <div class="user-chip">
      <div class="avatar">{{ userInitials }}</div>
      <div class="user-details">
        <span class="user-name">{{ currentUser?.name || 'User' }}</span>
        <span class="user-role">{{ currentUser?.role || 'Staff' }}</span>
      </div>
    </div>
  </div>
</div>
