name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run the workflow manually from the GitHub Actions tab

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Make mvnw executable
      run: chmod +x mvnw
        
    - name: Build with Maven
      run: ./mvnw clean package
      
    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/target/*.jar

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Fixed to 24 for Angular 22
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Angular Project
      run: npm run build
      
    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download Backend Artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: backend-artifact

    - name: Download Frontend Artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: frontend-artifact

    - name: Copy files to EC2 via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "backend-artifact/*.jar,frontend-artifact/**/*,docker-compose.yml,backend/Dockerfile,frontend/Dockerfile,frontend/nginx.conf"
        target: "/home/${{ secrets.EC2_USERNAME }}/deploy"

    - name: Execute deployment script on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/${{ secrets.EC2_USERNAME }}/deploy
          
          # Prepare the files exactly where the Dockerfiles expect them
          # Backend expects app.jar
          cp backend-artifact/*.jar backend/app.jar
          
          # Frontend expects 'html' folder
          # Check if 'browser' folder exists (Angular 17+), otherwise just use 'frontend'
          if [ -d "frontend-artifact/frontend/browser" ]; then
            cp -r frontend-artifact/frontend/browser frontend/html
          else
            cp -r frontend-artifact/frontend frontend/html
          fi
          
          # Export DB Password for docker-compose
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          
          # Stop old containers, rebuild images with new files, and start detached
          docker-compose down
          docker-compose up -d --build
